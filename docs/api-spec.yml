openapi: 3.0.0
info:
  title: Gym Management API
  description: |
    REST API for a single-gym management MVP: client management, medical
    records, exercise catalog, routine templates, payments, and dashboard
    alerts for a single admin user (gym owner/trainer).

    This API follows Domain-Driven Design principles and implements a
    layered architecture (see docs/backend-standards.md).

    This spec is living documentation: paths are added here as each user
    story is implemented via OpenSpec changes (see
    planning/user-stories-backlog.md). Only endpoints that have been fully
    designed are documented below.

  version: 0.1.0
  contact:
    name: Gym Management Development Team
  license:
    name: ISC

servers:
  - url: http://localhost:3000
    description: Development server

paths:
  /api/auth/login:
    post:
      summary: Log in
      description: Validates credentials and sets an httpOnly session cookie (JWT). See US-001.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many attempts (rate limited)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/logout:
    post:
      summary: Log out
      description: Clears the session cookie. See US-001.
      tags:
        - Auth
      responses:
        '204':
          description: Logout successful

  /api/auth/me:
    get:
      summary: Get current authenticated user
      description: Returns the currently authenticated user, used by the frontend on app load. See US-001.
      tags:
        - Auth
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/forgot-password:
    post:
      summary: Request a password reset
      description: |
        Accepts an email and always returns a generic success response
        (to avoid confirming/denying account existence). Sends a reset
        email only if the email matches the admin account. See US-001.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Generic acknowledgement (sent regardless of whether the email matched)
        '429':
          description: Too many attempts (rate limited)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/reset-password:
    post:
      summary: Reset password
      description: Validates the reset token and expiration, then updates the password. See US-001.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password updated successfully
        '400':
          description: Invalid, expired, or already-used token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/clients:
    get:
      summary: List clients
      description: List clients, optionally filtered by name search and status. See US-002.
      tags:
        - Clients
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Case-insensitive name fragment to filter by
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive]
          description: Filter by client status
      responses:
        '200':
          description: The list of matching clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Client'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a client
      tags:
        - Clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInput'
      responses:
        '201':
          description: Client created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A client with this DNI already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/clients/{id}:
    get:
      summary: Get a client by id
      tags:
        - Clients
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update a client
      tags:
        - Clients
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInput'
      responses:
        '200':
          description: Client updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: DNI belongs to another client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/clients/{id}/status:
    patch:
      summary: Activate or deactivate a client
      description: Logical status change (no hard delete). See US-002.
      tags:
        - Clients
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [active, inactive]
              required:
                - status
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/clients/{clientId}/medical-record:
    get:
      summary: Get a client's medical record
      description: Returns the client's medical record, or null when none exists yet. See US-003.
      tags:
        - Medical Records
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The medical record, or null if the client has none yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalRecordResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Create or update a client's medical record (upsert)
      description: >
        Creates the medical record when none exists and updates it otherwise.
        All fields are optional free text; an all-empty payload is valid. See US-003.
      tags:
        - Medical Records
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicalRecordInput'
      responses:
        '200':
          description: The saved medical record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalRecordResponse'
        '400':
          description: Validation error (e.g. a field exceeding its length limit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/clients/{clientId}/routine:
    get:
      summary: Get a client's active routine
      description: Returns the client's active routine (with computed endDate/isExpired), or null. See US-006.
      tags:
        - Client Routines
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The active routine, or null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRoutineResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Assign a routine to a client
      description: Deep-clones a library template into a client routine, closing any previous active routine.
      tags:
        - Client Routines
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoutineInput'
      responses:
        '201':
          description: The newly assigned active routine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRoutineResponse'
        '400':
          description: Validation error (missing/invalid fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client or template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Adjust a client's active routine
      description: Replaces the active routine's sessions/entries (same payload as templates), independently of the source template.
      tags:
        - Client Routines
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutineTemplateInput'
      responses:
        '200':
          description: The adjusted active routine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRoutineResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client has no active routine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/clients/{clientId}/routines/history:
    get:
      summary: List a client's previously assigned routines
      tags:
        - Client Routines
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The client's routine history (closed routines)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoutineTemplateSummary'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/clients/{clientId}/payments:
    get:
      summary: List a client's payments with the derived status
      description: Payments newest first, plus the client's derived payment status. See US-007.
      tags:
        - Payments
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The client's payments and derived status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ClientPayments'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Register a payment for a client
      tags:
        - Payments
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
      responses:
        '201':
          description: Payment registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/clients/{clientId}/payments/export:
    get:
      summary: Export a client's payment history as a PDF
      description: >
        Streams a downloadable PDF listing the client's payments (newest first)
        with the client's name and current derived payment status. See US-008.
      tags:
        - Payments
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
            type: integer
        - in: query
          name: lang
          required: false
          description: PDF language (defaults to Spanish; any other value falls back to `es`).
          schema:
            type: string
            enum: [es, en]
            default: es
      responses:
        '200':
          description: The payment history PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/payments/{id}:
    put:
      summary: Edit a payment
      description: Editing recomputes the client's derived status.
      tags:
        - Payments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
      responses:
        '200':
          description: Payment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a payment
      description: Deleting recomputes the client's derived status.
      tags:
        - Payments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Payment deleted
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/exercises:
    get:
      summary: List exercises
      description: Reusable exercise catalog, searchable by name and filterable by category. See US-004.
      tags:
        - Exercises
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Case-insensitive match on the exercise name
        - in: query
          name: category
          schema:
            type: string
            enum: [mobility, activation, main]
      responses:
        '200':
          description: List of exercises
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Exercise'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create an exercise
      tags:
        - Exercises
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseInput'
      responses:
        '201':
          description: Exercise created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/exercises/{id}:
    get:
      summary: Get an exercise
      tags:
        - Exercises
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The exercise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Exercise not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update an exercise
      description: No DELETE is exposed — exercises are never deleted so routines are not broken.
      tags:
        - Exercises
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseInput'
      responses:
        '200':
          description: Exercise updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Exercise not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/routine-templates:
    get:
      summary: List library routine templates
      description: Reusable templates (clientId is null). See US-005.
      tags:
        - Routine Templates
      responses:
        '200':
          description: List of template summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoutineTemplateSummary'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a routine template (nested)
      description: Creates a template with its nested sessions and exercise entries in one call.
      tags:
        - Routine Templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutineTemplateInput'
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineTemplateResponse'
        '400':
          description: Validation error (no session, unknown exercise, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/routine-templates/{id}:
    get:
      summary: Get a routine template with full nested detail
      tags:
        - Routine Templates
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The template with sessions and ordered entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineTemplateResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update a routine template (full replace of nested data)
      description: Replaces the template's sessions and entries atomically.
      tags:
        - Routine Templates
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutineTemplateInput'
      responses:
        '200':
          description: Template updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineTemplateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/routine-templates/{id}/duplicate:
    post:
      summary: Duplicate a routine template (independent deep copy)
      description: Creates a new library template that is a deep copy of the source; editing it never affects the original.
      tags:
        - Routine Templates
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: The new independent template copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineTemplateResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Source template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
        - email
        - password

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email

    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password
      required:
        - token
        - newPassword

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          description: User ID
        email:
          type: string
          format: email
      required:
        - id
        - email

    ClientInput:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dni:
          type: string
          description: 7 or 8 digits, unique across clients
        phone:
          type: string
        email:
          type: string
          format: email
        birthDate:
          type: string
          format: date
        address:
          type: string
          nullable: true
        goal:
          type: string
          nullable: true
        emergencyContactName:
          type: string
          nullable: true
        emergencyContactPhone:
          type: string
          nullable: true
        emergencyContactRelationship:
          type: string
          nullable: true
      required:
        - firstName
        - lastName
        - dni
        - phone
        - email
        - birthDate

    Client:
      allOf:
        - $ref: '#/components/schemas/ClientInput'
        - type: object
          properties:
            id:
              type: integer
            status:
              type: string
              enum: [active, inactive]
            joinDate:
              type: string
              format: date-time
            hasActiveRoutine:
              type: boolean
              description: Whether the client currently has an active routine assigned (present in the list response). See US-006.
            paymentStatus:
              type: string
              enum: [up_to_date, overdue, no_payments]
              description: Derived payment status (present in the list response). See US-007.

    ClientResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Client'

    MedicalRecordInput:
      type: object
      description: All fields optional free text (max 1000 chars each); bloodType max 10 chars. An all-empty payload is valid.
      properties:
        preexistingConditions:
          type: string
          nullable: true
        injuries:
          type: string
          nullable: true
        surgeriesOrProsthetics:
          type: string
          nullable: true
        physicalRestrictions:
          type: string
          nullable: true
        medication:
          type: string
          nullable: true
        allergies:
          type: string
          nullable: true
        bloodType:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    MedicalRecord:
      allOf:
        - $ref: '#/components/schemas/MedicalRecordInput'
        - type: object
          properties:
            id:
              type: integer
            clientId:
              type: integer

    MedicalRecordResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MedicalRecord'

    ExerciseInput:
      type: object
      properties:
        name:
          type: string
        muscleGroup:
          type: string
        category:
          type: string
          enum: [mobility, activation, main]
        defaultSets:
          type: integer
          nullable: true
        defaultReps:
          type: integer
          nullable: true
        technique:
          type: string
          nullable: true
        equipment:
          type: string
          nullable: true
      required:
        - name
        - muscleGroup
        - category

    Exercise:
      allOf:
        - $ref: '#/components/schemas/ExerciseInput'
        - type: object
          properties:
            id:
              type: integer

    ExerciseResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Exercise'

    RoutineExerciseEntryInput:
      type: object
      properties:
        exerciseId:
          type: integer
        phase:
          type: string
          enum: [warmup, main]
        block:
          type: string
          nullable: true
        kg:
          type: number
          nullable: true
        reps:
          type: integer
          nullable: true
        series:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        order:
          type: integer
      required:
        - exerciseId
        - phase
        - order

    RoutineSessionInput:
      type: object
      properties:
        name:
          type: string
        warmupPrescription:
          type: string
          nullable: true
        order:
          type: integer
        entries:
          type: array
          items:
            $ref: '#/components/schemas/RoutineExerciseEntryInput'
      required:
        - name
        - order
        - entries

    RoutineTemplateInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        objective:
          type: string
          nullable: true
        generalConsiderations:
          type: string
          nullable: true
        sessions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RoutineSessionInput'
      required:
        - name
        - sessions

    RoutineExerciseEntry:
      allOf:
        - $ref: '#/components/schemas/RoutineExerciseEntryInput'
        - type: object
          properties:
            id:
              type: integer
            exerciseName:
              type: string

    RoutineSession:
      allOf:
        - $ref: '#/components/schemas/RoutineSessionInput'
        - type: object
          properties:
            id:
              type: integer
            entries:
              type: array
              items:
                $ref: '#/components/schemas/RoutineExerciseEntry'

    RoutineTemplate:
      allOf:
        - $ref: '#/components/schemas/RoutineTemplateInput'
        - type: object
          properties:
            id:
              type: integer
            status:
              type: string
              enum: [draft, active, expired]
            clientId:
              type: integer
              nullable: true
            sessions:
              type: array
              items:
                $ref: '#/components/schemas/RoutineSession'

    RoutineTemplateSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        objective:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, active, expired]
        sessionCount:
          type: integer

    RoutineTemplateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/RoutineTemplate'

    AssignRoutineInput:
      type: object
      properties:
        templateId:
          type: integer
        startDate:
          type: string
          format: date
        durationWeeks:
          type: integer
      required:
        - templateId
        - startDate
        - durationWeeks

    ClientRoutine:
      allOf:
        - $ref: '#/components/schemas/RoutineTemplate'
        - type: object
          properties:
            sourceTemplateId:
              type: integer
              nullable: true
            startDate:
              type: string
              format: date-time
              nullable: true
            durationWeeks:
              type: integer
              nullable: true
            endDate:
              type: string
              format: date-time
              nullable: true
              description: Computed from startDate + durationWeeks
            isExpired:
              type: boolean
              description: Computed at read time

    ClientRoutineResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ClientRoutine'

    PaymentInput:
      type: object
      properties:
        amount:
          type: number
        paymentDate:
          type: string
          format: date
        method:
          type: string
          enum: [cash, bank_transfer, card]
        periodMonth:
          type: integer
          minimum: 1
          maximum: 12
        periodYear:
          type: integer
      required:
        - amount
        - paymentDate
        - method
        - periodMonth
        - periodYear

    Payment:
      allOf:
        - $ref: '#/components/schemas/PaymentInput'
        - type: object
          properties:
            id:
              type: integer
            clientId:
              type: integer

    PaymentResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Payment'

    ClientPayments:
      type: object
      properties:
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        status:
          type: string
          enum: [up_to_date, overdue, no_payments]
          description: Derived from the most recent covered period vs. today

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            message:
              type: string
              description: Error message
            code:
              type: string
              description: Machine-readable error code
      required:
        - success
        - error

tags:
  - name: Auth
    description: Authentication endpoints for the single admin user (US-001)
  - name: Clients
    description: Gym client management (US-002)
  - name: Medical Records
    description: Client medical records (US-003)
  - name: Exercises
    description: Reusable exercise catalog (US-004)
  - name: Routine Templates
    description: Reusable routine templates with nested sessions and exercises (US-005)
  - name: Client Routines
    description: Routines assigned to a client (clone of a template with a lifecycle) (US-006)
  - name: Payments
    description: Client payments with a derived up-to-date/overdue status (US-007)

# NOTE: The Dashboard resource (US-009) will be documented here as its user
# story is enriched and implemented via an OpenSpec change.
# See planning/user-stories-backlog.md.



