openapi: 3.0.0
info:
  title: Gym Management API
  description: |
    REST API for a single-gym management MVP: client management, medical
    records, exercise catalog, routine templates, payments, and dashboard
    alerts for a single admin user (gym owner/trainer).

    This API follows Domain-Driven Design principles and implements a
    layered architecture (see docs/backend-standards.md).

    This spec is living documentation: paths are added here as each user
    story is implemented via OpenSpec changes (see
    planning/user-stories-backlog.md). Only endpoints that have been fully
    designed are documented below.

  version: 0.1.0
  contact:
    name: Gym Management Development Team
  license:
    name: ISC

servers:
  - url: http://localhost:3000
    description: Development server

paths:
  /api/auth/login:
    post:
      summary: Log in
      description: Validates credentials and sets an httpOnly session cookie (JWT). See US-001.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many attempts (rate limited)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/logout:
    post:
      summary: Log out
      description: Clears the session cookie. See US-001.
      tags:
        - Auth
      responses:
        '204':
          description: Logout successful

  /api/auth/me:
    get:
      summary: Get current authenticated user
      description: Returns the currently authenticated user, used by the frontend on app load. See US-001.
      tags:
        - Auth
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/forgot-password:
    post:
      summary: Request a password reset
      description: |
        Accepts an email and always returns a generic success response
        (to avoid confirming/denying account existence). Sends a reset
        email only if the email matches the admin account. See US-001.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Generic acknowledgement (sent regardless of whether the email matched)
        '429':
          description: Too many attempts (rate limited)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/reset-password:
    post:
      summary: Reset password
      description: Validates the reset token and expiration, then updates the password. See US-001.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password updated successfully
        '400':
          description: Invalid, expired, or already-used token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/clients:
    get:
      summary: List clients
      description: List clients, optionally filtered by name search and status. See US-002.
      tags:
        - Clients
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Case-insensitive name fragment to filter by
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive]
          description: Filter by client status
      responses:
        '200':
          description: The list of matching clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Client'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a client
      tags:
        - Clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInput'
      responses:
        '201':
          description: Client created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A client with this DNI already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/clients/{id}:
    get:
      summary: Get a client by id
      tags:
        - Clients
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update a client
      tags:
        - Clients
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInput'
      responses:
        '200':
          description: Client updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: DNI belongs to another client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/clients/{id}/status:
    patch:
      summary: Activate or deactivate a client
      description: Logical status change (no hard delete). See US-002.
      tags:
        - Clients
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [active, inactive]
              required:
                - status
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/clients/{clientId}/medical-record:
    get:
      summary: Get a client's medical record
      description: Returns the client's medical record, or null when none exists yet. See US-003.
      tags:
        - Medical Records
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The medical record, or null if the client has none yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalRecordResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Create or update a client's medical record (upsert)
      description: >
        Creates the medical record when none exists and updates it otherwise.
        All fields are optional free text; an all-empty payload is valid. See US-003.
      tags:
        - Medical Records
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicalRecordInput'
      responses:
        '200':
          description: The saved medical record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalRecordResponse'
        '400':
          description: Validation error (e.g. a field exceeding its length limit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
        - email
        - password

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email

    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password
      required:
        - token
        - newPassword

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          description: User ID
        email:
          type: string
          format: email
      required:
        - id
        - email

    ClientInput:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dni:
          type: string
          description: 7 or 8 digits, unique across clients
        phone:
          type: string
        email:
          type: string
          format: email
        birthDate:
          type: string
          format: date
        address:
          type: string
          nullable: true
        goal:
          type: string
          nullable: true
        emergencyContactName:
          type: string
          nullable: true
        emergencyContactPhone:
          type: string
          nullable: true
        emergencyContactRelationship:
          type: string
          nullable: true
      required:
        - firstName
        - lastName
        - dni
        - phone
        - email
        - birthDate

    Client:
      allOf:
        - $ref: '#/components/schemas/ClientInput'
        - type: object
          properties:
            id:
              type: integer
            status:
              type: string
              enum: [active, inactive]
            joinDate:
              type: string
              format: date-time

    ClientResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Client'

    MedicalRecordInput:
      type: object
      description: All fields optional free text (max 1000 chars each); bloodType max 10 chars. An all-empty payload is valid.
      properties:
        preexistingConditions:
          type: string
          nullable: true
        injuries:
          type: string
          nullable: true
        surgeriesOrProsthetics:
          type: string
          nullable: true
        physicalRestrictions:
          type: string
          nullable: true
        medication:
          type: string
          nullable: true
        allergies:
          type: string
          nullable: true
        bloodType:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    MedicalRecord:
      allOf:
        - $ref: '#/components/schemas/MedicalRecordInput'
        - type: object
          properties:
            id:
              type: integer
            clientId:
              type: integer

    MedicalRecordResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MedicalRecord'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            message:
              type: string
              description: Error message
            code:
              type: string
              description: Machine-readable error code
      required:
        - success
        - error

tags:
  - name: Auth
    description: Authentication endpoints for the single admin user (US-001)
  - name: Clients
    description: Gym client management (US-002)
  - name: Medical Records
    description: Client medical records (US-003)

# NOTE: Additional resources (Exercises, Routine Templates, Payments,
# Dashboard) will be documented here as their corresponding user stories
# (US-004 through US-009) are enriched and implemented via OpenSpec changes.
# See planning/user-stories-backlog.md.



