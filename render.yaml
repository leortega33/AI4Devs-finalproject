# Render Blueprint (optional free-tier cloud deployment).
# Alternative to the local Docker + Cloudflare Tunnel flow (see docs/deployment.md).
# Deploy via https://dashboard.render.com -> "New" -> "Blueprint" pointing at this repo.
# No secret values are stored here: JWT_SECRET is generated, DATABASE_URL is wired
# from the managed database, and the admin credentials are set in the dashboard.
services:
  - type: web
    name: gym-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gym-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DASHBOARD_DUE_SOON_DAYS
        value: "5"

databases:
  - name: gym-db
    plan: free
    databaseName: gymDb
    user: gymDbUser
